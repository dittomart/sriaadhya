<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"/>
<title>Out of delivery area — SRI AADHYA FROZENS</title>
<link rel="icon" type="image/png" href="assets/images/logo.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{screens:{xs:'420px'}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css"/>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex items-center justify-center px-6 bg-[var(--cream)]">
  <div class="max-w-md w-full text-center" style="animation:fadeUp .5s ease">
    <div class="w-24 h-24 rounded-full bg-[var(--leaf-100)] flex items-center justify-center mx-auto mb-6 relative">
      <div class="absolute inset-0 rounded-full pulse-ring"></div>
      <i data-lucide="map-pin-off" class="w-11 h-11 text-[var(--green-700)]"></i>
    </div>
    <h1 class="display text-2xl font-extrabold">We're not in your area<br/>just yet 🌱</h1>
    <p class="text-[var(--ink-soft)] text-sm mt-3" id="msg">Your location is outside our 10 km delivery zone from Avinashi. We're growing fast — try a different address nearby.</p>

    <div class="card p-4 mt-6 text-left">
      <div class="flex items-center gap-2 text-sm font-bold mb-1"><i data-lucide="bell" class="w-4 h-4 text-[var(--mustard)]"></i> Notify me when you arrive</div>
      <div class="flex gap-2 mt-2">
        <input class="field" placeholder="WhatsApp number"/>
        <button onclick="toast('We\'ll notify you soon!','ok','bell')" class="btn btn-primary px-4">Notify</button>
      </div>
    </div>

    <button onclick="location.href='location.html'" class="btn btn-primary w-full mt-5 py-3"><i data-lucide="navigation" class="w-4 h-4"></i> Change Location</button>
    <a href="https://wa.me/917092229777" target="_blank" class="btn btn-ghost w-full mt-3 py-3"><i data-lucide="message-circle" class="w-4 h-4"></i> Chat with us on WhatsApp</a>
  </div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
lucide.createIcons();
const loc = get(LS.loc);
if(loc && loc.distance_from_store_km) document.getElementById('msg').textContent =
  `Your location is ${loc.distance_from_store_km} km from our Avinashi store — beyond our 10 km zone. We're growing fast! Try an address closer to Avinashi/Tirupur.`;
</script>
</body>
</html>
