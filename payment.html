<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Payment — SRI AADHYA FROZENS</title>
<link rel="icon" type="image/png" href="assets/images/logo.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.png"/>
<link rel="shortcut icon" type="image/x-icon" href="assets/images/logo.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{screens:{xs:'420px'}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css"/>
<script src="https://unpkg.com/lucide@latest"></script>
<script>if(!JSON.parse(localStorage.getItem('dittomart_location')||'null')?.latitude)location.replace('login.html');</script>
</head>
<body>
<div id="app-header"></div>
<main class="pt-16 pb-28 lg:pb-10">
  <div class="max-w-4xl mx-auto px-4 lg:px-8 mt-4">
    <a href="address.html" class="text-sm font-bold text-[var(--green-700)] flex items-center gap-1 mb-3"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back to address</a>
    <h1 class="display text-2xl font-extrabold mb-4 flex items-center gap-2"><i data-lucide="credit-card" class="w-6 h-6 text-[var(--green-700)]"></i> Payment</h1>

    <div class="flex flex-col lg:flex-row gap-6">
      <div class="lg:w-3/5">
        <p class="text-sm font-bold text-[var(--ink-soft)] mb-2">Recommended</p>
        <label class="card p-4 flex items-center gap-3 mb-3 cursor-pointer pmethod" data-m="upi">
          <input type="radio" name="pm" class="accent-[var(--green-700)] w-4 h-4" checked/>
          <div class="w-10 h-10 rounded-lg bg-[var(--leaf-100)] flex items-center justify-center"><i data-lucide="smartphone" class="w-5 h-5 text-[var(--green-700)]"></i></div>
          <div class="flex-1"><div class="font-bold">UPI</div><div class="text-[12px] text-[var(--ink-soft)]">GPay, PhonePe, Paytm, BHIM</div></div>
          <div class="flex gap-1 text-[10px] font-bold text-[var(--ink-soft)]">⚡Fast</div>
        </label>

        <p class="text-sm font-bold text-[var(--ink-soft)] mb-2 mt-4">More options</p>
        <label class="card p-4 flex items-center gap-3 mb-3 cursor-pointer pmethod" data-m="card">
          <input type="radio" name="pm" class="accent-[var(--green-700)] w-4 h-4"/>
          <div class="w-10 h-10 rounded-lg bg-[var(--cream-2)] flex items-center justify-center"><i data-lucide="credit-card" class="w-5 h-5 text-[var(--green-800)]"></i></div>
          <div class="flex-1"><div class="font-bold">Credit / Debit Card</div><div class="text-[12px] text-[var(--ink-soft)]">Visa, Mastercard, RuPay</div></div>
        </label>
        <label class="card p-4 flex items-center gap-3 mb-3 cursor-pointer pmethod" data-m="wallet">
          <input type="radio" name="pm" class="accent-[var(--green-700)] w-4 h-4"/>
          <div class="w-10 h-10 rounded-lg bg-[var(--cream-2)] flex items-center justify-center"><i data-lucide="wallet" class="w-5 h-5 text-[var(--green-800)]"></i></div>
          <div class="flex-1"><div class="font-bold">Wallets</div><div class="text-[12px] text-[var(--ink-soft)]">Paytm, Amazon Pay, Mobikwik</div></div>
        </label>

        <div class="card p-3 flex items-center gap-2 text-[12px] text-[var(--ink-soft)] mt-2">
          <i data-lucide="shield-check" class="w-4 h-4 text-[var(--green-700)]"></i> 100% secure payments. Cash on Delivery is not available.
        </div>
      </div>

      <!-- summary -->
      <div class="lg:w-2/5">
        <div class="card p-5 lg:sticky lg:top-20">
          <h3 class="font-extrabold mb-3">Order Summary</h3>
          <div id="addrLine" class="text-[12px] text-[var(--ink-soft)] mb-3 flex gap-2"></div>
          <div id="sumRows" class="space-y-2 text-sm border-t border-[var(--line)] pt-3"></div>
          <button onclick="pay()" class="btn btn-primary w-full mt-4 py-3.5 text-base">Pay <span id="payAmt"></span></button>
          <div class="text-center text-[11px] text-[var(--ink-soft)] mt-2">Joined by 1,240+ happy customers in Tirupur</div>
        </div>
      </div>
    </div>
  </div>
</main>
<div id="app-bottomnav"></div>
<div id="app-whatsapp"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
serviceableGate(); mountChrome('');
let method='upi';
document.querySelectorAll('.pmethod').forEach(el=>el.addEventListener('click',()=>{ method=el.dataset.m; }));

const ck = get('dittomart_checkout', null) || (function(){ const sub=cartSubtotal(); const del=cartCount()?deliveryCharge():0; const tax=Math.round(sub*0.05); return {sub,disc:0,del,tax,total:sub+del+tax}; })();
document.getElementById('sumRows').innerHTML = `
  <div class="flex justify-between"><span class="text-[var(--ink-soft)]">Items (${cartCount()})</span><span>${rupee(ck.sub)}</span></div>
  ${ck.disc?`<div class="flex justify-between text-[var(--green-700)]"><span>Discount</span><span>− ${rupee(ck.disc)}</span></div>`:''}
  <div class="flex justify-between"><span class="text-[var(--ink-soft)]">Delivery</span><span>${rupee(ck.del)}</span></div>
  <div class="flex justify-between"><span class="text-[var(--ink-soft)]">Taxes</span><span>${rupee(ck.tax)}</span></div>
  <div class="flex justify-between font-extrabold text-lg border-t border-[var(--line)] pt-2"><span>To Pay</span><span class="text-[var(--green-800)]">${rupee(ck.total)}</span></div>`;
document.getElementById('payAmt').textContent = rupee(ck.total);

const addr = get(LS.addr,[]).find(a=>a.id===get(LS.activeAddr));
if(addr) document.getElementById('addrLine').innerHTML = `<i data-lucide="map-pin" class="w-4 h-4 text-[var(--green-700)] flex-none"></i> <span><b>${addr.label}</b> — ${addr.house_no}, ${addr.street}, ${addr.city}</span>`;

function pay(){ set('dittomart_pay_method', method); location.href='payment-processing.html'; }
lucide.createIcons();
</script>
</body>
</html>
