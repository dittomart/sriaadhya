<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Track Order — SRI AADHYA FROZENS</title>
<link rel="icon" type="image/png" href="assets/images/logo.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{screens:{xs:'420px'}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css"/>
<script src="https://unpkg.com/lucide@latest"></script>
<script>if(!JSON.parse(localStorage.getItem('dittomart_location')||'null')?.latitude)location.replace('login.html');</script>
<style>
  /* curved green hero (matches login/profile) */
  .hero-wave{position:relative;overflow:hidden;background:linear-gradient(135deg,#0B4D2C 0%,#15803D 55%,#16A34A 100%);background-size:180% 180%;animation:gradientShift 11s ease infinite;border-radius:28px;box-shadow:0 22px 46px rgba(11,77,44,.26)}
  .hero-wave::after{content:"";position:absolute;top:-40%;right:-8%;width:55%;height:130%;background:radial-gradient(closest-side,rgba(255,255,255,.18),transparent 70%);pointer-events:none}

  /* big ETA ring */
  .eta-ring{position:relative;width:104px;height:104px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3)}
  .eta-ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid rgba(255,255,255,.45);border-top-color:#E1FFE9;animation:spinSlow 2.6s linear infinite}
  .eta-ring::after{content:"";position:absolute;inset:0;border-radius:50%;animation:pulseRing 2s infinite}

  /* live map */
  .map-card{position:relative;height:13rem;overflow:hidden;background:linear-gradient(135deg,#e7f3ea,#d4ead9)}
  .map-grid{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(circle,#15803d22 1px,transparent 1px);background-size:18px 18px;animation:gridDrift 6s linear infinite}
  @keyframes gridDrift{from{background-position:0 0}to{background-position:18px 18px}}
  .route-base{position:absolute;left:7%;right:11%;top:50%;height:5px;transform:translateY(-50%);background:rgba(21,128,61,.18);border-radius:99px}
  .route-dash{position:absolute;left:7%;right:11%;top:50%;height:5px;transform:translateY(-50%);border-radius:99px;background:repeating-linear-gradient(90deg,var(--green-600) 0 12px,transparent 12px 24px);background-size:24px 100%;animation:dashMove 1s linear infinite;opacity:.8}
  @keyframes dashMove{from{background-position:0 0}to{background-position:24px 0}}
  .pin-pulse{position:relative}
  .pin-pulse::after{content:"";position:absolute;inset:-8px;border-radius:50%;background:rgba(34,197,94,.35);animation:pulseRing 2s infinite}
  .scooter{position:absolute;top:calc(50% - 26px);font-size:1.6rem;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18));animation:truckMove 3.4s ease-in-out infinite alternate,bobie 1s ease-in-out infinite}
  @keyframes bobie{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  .partner-card{transition:box-shadow .25s,transform .25s}
  .partner-card:hover{transform:translateY(-2px)}
  .ic-btn{transition:transform .18s,box-shadow .18s}
  .ic-btn:hover{transform:translateY(-3px) scale(1.05)}
</style>
</head>
<body>
<div id="app-header"></div>
<main class="pt-16 pb-24 lg:pb-10">
  <div class="max-w-2xl mx-auto px-4 lg:px-8 mt-4">

    <!-- empty state -->
    <div id="noOrder" class="hidden card p-10 text-center rise">
      <div class="text-6xl mb-3 float">📦</div><p class="font-extrabold text-lg">No active order</p>
      <p class="text-sm text-[var(--ink-soft)] mt-1">Place an order to track it live here.</p>
      <a href="home.html" class="btn btn-primary mt-4 px-6 py-3 inline-flex">Start shopping <i data-lucide="arrow-right" class="w-4 h-4"></i></a>
    </div>

    <div id="trackWrap">
      <!-- ===== HERO ===== -->
      <div class="hero-wave text-white p-6 relative rise">
        <div class="absolute text-6xl opacity-15 leaf-sway" style="right:-4px;bottom:-10px">🌿</div>
        <div class="relative flex items-center gap-5">
          <div class="eta-ring flex-none">
            <span class="display text-3xl font-extrabold leading-none" id="etaMin">30</span>
            <span class="text-[10px] font-bold uppercase tracking-widest text-white/85 mt-.5">min</span>
          </div>
          <div class="flex-1 min-w-0">
            <span class="inline-flex items-center gap-1.5 text-[11px] font-bold bg-white/20 border border-white/25 px-2.5 py-1 rounded-full"><span class="w-2 h-2 rounded-full bg-[#4ADE80] animate-pulse"></span> <span id="heroStatus">Live tracking</span></span>
            <h1 class="display text-2xl font-extrabold mt-2">Your order is on the way</h1>
            <p id="oid" class="text-sm text-white/85 mt-1 truncate"></p>
          </div>
        </div>
      </div>

      <!-- ===== LIVE MAP ===== -->
      <div class="card map-card overflow-hidden my-4 relative rise d1">
        <div class="map-grid"></div>
        <div class="route-base"></div>
        <div class="route-dash"></div>
        <div class="scooter">🛵</div>
        <!-- store -->
        <div class="absolute left-[4%] top-1/2 -translate-y-1/2 flex flex-col items-center gap-1">
          <div class="pin-pulse w-9 h-9 rounded-full bg-white flex items-center justify-center shadow"><i data-lucide="store" class="w-4 h-4 text-[var(--green-700)]"></i></div>
          <span class="text-[10px] font-bold bg-white/80 px-1.5 rounded">Store</span>
        </div>
        <!-- you -->
        <div class="absolute right-[5%] top-1/2 -translate-y-1/2 flex flex-col items-center gap-1">
          <div class="pin-pulse w-9 h-9 rounded-full bg-[var(--green-700)] flex items-center justify-center shadow"><i data-lucide="home" class="w-4 h-4 text-white"></i></div>
          <span class="text-[10px] font-bold bg-white/80 px-1.5 rounded">You</span>
        </div>
        <div class="absolute bottom-3 left-3 text-[11px] font-bold bg-white/85 backdrop-blur px-2.5 py-1 rounded-full flex items-center gap-1 shadow"><i data-lucide="navigation" class="w-3 h-3 text-[var(--green-700)]"></i> Avinashi → You</div>
      </div>

      <!-- ===== TIMELINE ===== -->
      <div class="card p-5 relative rise d2">
        <h3 class="display text-base font-extrabold mb-4 flex items-center gap-2"><i data-lucide="route" class="w-4 h-4 text-[var(--green-700)]"></i> Order progress</h3>
        <div class="relative pl-1">
          <div class="tl-line"></div><div class="tl-fill" id="tlFill" style="height:0"></div>
          <div id="timeline" class="space-y-5 relative"></div>
        </div>
      </div>

      <!-- ===== DELIVERY PARTNER ===== -->
      <div id="partner" class="card partner-card p-4 mt-4 flex items-center gap-3 hidden rise">
        <div class="relative flex-none">
          <img src="https://i.pravatar.cc/80?img=12" class="w-12 h-12 rounded-full object-cover border-2 border-[var(--leaf-100)]"/>
          <span class="absolute -bottom-.5 -right-.5 w-4 h-4 rounded-full bg-[var(--green-600)] border-2 border-white"></span>
        </div>
        <div class="flex-1 min-w-0"><div class="font-extrabold">Murugan K.</div><div class="text-[12px] text-[var(--ink-soft)] flex items-center gap-1"><i data-lucide="star" class="w-3 h-3 fill-[var(--mustard)] text-[var(--mustard)]"></i> 4.9 • Your delivery partner</div></div>
        <a href="tel:+917092229777" class="ic-btn w-11 h-11 rounded-full bg-[var(--green-700)] flex items-center justify-center shadow"><i data-lucide="phone" class="w-5 h-5 text-white"></i></a>
        <a href="https://wa.me/917092229777" target="_blank" class="ic-btn w-11 h-11 rounded-full bg-[#25D366] flex items-center justify-center shadow"><i data-lucide="message-circle" class="w-5 h-5 text-white"></i></a>
      </div>

      <!-- ===== REORDER (after delivered) ===== -->
      <div id="reorderBox" class="hidden card p-6 mt-4 text-center bg-[var(--leaf-100)] border-[var(--green-500)]/40 rise">
        <div class="w-14 h-14 rounded-2xl bg-white shadow flex items-center justify-center mx-auto"><i data-lucide="party-popper" class="w-7 h-7 text-[var(--green-700)]"></i></div>
        <p class="font-extrabold text-lg mt-3">Delivered! Enjoyed it? 🎉</p>
        <p class="text-sm text-[var(--ink-soft)] mt-1">Reorder your favourites in a single tap.</p>
        <button onclick="reorder()" class="btn btn-primary mt-4 px-6 py-3 shine-wrap"><i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reorder in 1 tap</button>
      </div>
    </div>
  </div>
</main>
<div id="app-bottomnav"></div>
<div id="app-whatsapp"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
locationGate(); mountChrome('orders');

const order = get(LS.activeOrder, null) || (get(LS.orders,[])[0]||null);
if(!order){ document.getElementById('trackWrap').classList.add('hidden'); document.getElementById('noOrder').classList.remove('hidden'); }
else {
  document.getElementById('oid').textContent = `Order ${order.id} • ${order.items.length} items`;
  const steps=[
    {k:'Placed',ico:'check-circle-2',sub:'Order received'},
    {k:'Accepted',ico:'clipboard-check',sub:'Store confirmed your order'},
    {k:'Packed',ico:'package-check',sub:'Items packed & quality-checked'},
    {k:'Out for Delivery',ico:'bike',sub:'On the way to you'},
    {k:'Delivered',ico:'home',sub:'Enjoy your fresh order!'},
  ];
  const tl=document.getElementById('timeline');
  tl.innerHTML = steps.map((s,i)=>`
    <div class="flex items-center gap-4 tlrow" data-i="${i}">
      <div class="tl-node" id="node${i}"><i data-lucide="${s.ico}" class="w-5 h-5"></i></div>
      <div><div class="font-bold text-sm" id="lbl${i}">${s.k}</div><div class="text-[12px] text-[var(--ink-soft)]">${s.sub}</div><div class="text-[11px] text-[var(--green-700)] font-bold hidden" id="time${i}"></div></div>
    </div>`).join('');
  lucide.createIcons();

  let cur=0;
  const advance=()=>{
    for(let i=0;i<=cur;i++){ const n=document.getElementById('node'+i); n.classList.remove('active'); n.classList.add('done'); document.getElementById('time'+i).classList.remove('hidden'); document.getElementById('time'+i).textContent=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
    if(cur<steps.length){ const n=document.getElementById('node'+cur); n.classList.add('active'); }
    document.getElementById('tlFill').style.height = (cur/(steps.length-1))*100+'%';
    document.getElementById('etaMin').textContent = Math.max(2, 30 - cur*7);
    document.getElementById('heroStatus').textContent = steps[Math.min(cur,steps.length-1)].k;
    if(cur>=3) document.getElementById('partner').classList.remove('hidden');
    if(cur>=steps.length-1){ document.getElementById('reorderBox').classList.remove('hidden'); document.getElementById('heroStatus').textContent='Delivered'; order.status='Delivered'; set(LS.activeOrder,order); const all=get(LS.orders,[]); if(all[0])all[0].status='Delivered'; set(LS.orders,all); }
    else { cur++; setTimeout(advance,5000); }
  };
  advance();
}

function reorder(){ const cart=order.items.map(i=>({key:i.id,id:i.id,name:i.name,price:i.price,img:i.img,foodType:i.foodType,qty:i.qty,unit:i.unit})); set(LS.cart,cart); syncCartBadges(); toast('Items added to cart','ok','rotate-ccw'); setTimeout(()=>location.href='cart.html',600); }
</script>
</body>
</html>
