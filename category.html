<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Categories — SRI AADHYA FROZENS</title>
<link rel="icon" type="image/png" href="assets/images/logo.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.png"/>
<link rel="shortcut icon" type="image/x-icon" href="assets/images/logo.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{screens:{xs:'420px'}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css"/>
<script src="https://unpkg.com/lucide@latest"></script>
<script>if(!JSON.parse(localStorage.getItem('dittomart_location')||'null')?.latitude)location.replace('login.html');</script>
</head>
<body>
<div id="app-header"></div>

<main class="pt-16 pb-24 lg:pb-10">
  <div class="max-w-7xl mx-auto px-4 lg:px-8 mt-4">
    <!-- mobile search -->
    <div class="md:hidden flex items-center bg-white border border-[var(--line)] rounded-xl px-3 h-11 mb-3">
      <i data-lucide="search" class="w-4 h-4 text-[var(--ink-soft)]"></i>
      <input id="catSearch" placeholder="Search products…" class="flex-1 bg-transparent outline-none text-sm px-2"/>
    </div>

    <!-- category chips scroller -->
    <div class="flex gap-2 overflow-x-auto hide-scroll pb-1 -mx-1 px-1">
      <button class="chip catChip active" data-cat="all">All</button>
      <span id="catChips"></span>
    </div>

    <div class="flex items-center justify-between mt-4">
      <h1 id="catTitle" class="display text-xl lg:text-2xl font-extrabold">All Products</h1>
      <div class="flex items-center gap-2">
        <button onclick="openFilter()" class="lg:hidden btn btn-ghost px-3 py-2 text-sm"><i data-lucide="sliders-horizontal" class="w-4 h-4"></i> Filter</button>
        <select id="sort" onchange="render()" class="field w-auto py-2 text-sm">
          <option value="pop">Popularity</option>
          <option value="lh">Price: Low → High</option>
          <option value="hl">Price: High → Low</option>
          <option value="rt">Rating</option>
        </select>
      </div>
    </div>

    <!-- food filter chips -->
    <div class="flex gap-2 mt-3">
      <button class="chip foodChip active" data-f="all">All</button>
      <button class="chip foodChip" data-f="veg">🟢 Veg</button>
      <button class="chip foodChip" data-f="non-veg">🔴 Non-Veg</button>
      <button class="chip foodChip" data-f="other">🟡 Other</button>
    </div>

    <div class="flex gap-6 mt-5">
      <!-- desktop sidebar filter -->
      <aside class="hidden lg:block w-60 flex-none">
        <div class="card p-4 sticky top-20">
          <h3 class="font-extrabold mb-3 flex items-center gap-2"><i data-lucide="sliders-horizontal" class="w-4 h-4"></i> Filters</h3>
          <div class="mb-4">
            <label class="text-sm font-bold">Max price: <span id="priceVal" class="text-[var(--green-700)]">₹500</span></label>
            <input id="priceRange" type="range" min="40" max="500" value="500" class="w-full accent-[var(--green-700)] mt-2" oninput="document.getElementById('priceVal').textContent='₹'+this.value;render()"/>
          </div>
          <label class="flex items-center gap-2 text-sm font-semibold cursor-pointer"><input id="inStock" type="checkbox" class="accent-[var(--green-700)] w-4 h-4" onchange="render()"/> In-stock only</label>
          <div class="mt-4 pt-4 border-t border-[var(--line)]">
            <h4 class="font-bold text-sm mb-2">Categories</h4>
            <div id="sideCats" class="space-y-1"></div>
          </div>
        </div>
      </aside>

      <div class="flex-1">
        <div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
        <div id="empty" class="hidden text-center py-16">
          <i data-lucide="package-search" class="w-12 h-12 text-[var(--ink-soft)] mx-auto"></i>
          <p class="mt-3 font-bold">No products match your filters</p>
          <button onclick="resetFilters()" class="btn btn-ghost mt-3 px-4 py-2 text-sm">Reset filters</button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- mobile filter sheet -->
<div id="filterSheet" class="modal-back hidden" onclick="if(event.target===this)closeFilter()">
  <div class="modal-card p-5">
    <div class="flex items-center justify-between mb-4"><h3 class="font-extrabold text-lg">Filters</h3><button onclick="closeFilter()" class="w-8 h-8 rounded-lg bg-[var(--cream-2)] flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button></div>
    <label class="text-sm font-bold">Max price: <span id="priceValM" class="text-[var(--green-700)]">₹500</span></label>
    <input id="priceRangeM" type="range" min="40" max="500" value="500" class="w-full accent-[var(--green-700)] mt-2 mb-4" oninput="document.getElementById('priceValM').textContent='₹'+this.value"/>
    <label class="flex items-center gap-2 text-sm font-semibold cursor-pointer mb-4"><input id="inStockM" type="checkbox" class="accent-[var(--green-700)] w-4 h-4"/> In-stock only</label>
    <button onclick="applyMobileFilter()" class="btn btn-primary w-full py-3">Apply filters</button>
  </div>
</div>

<div id="app-footer"></div>
<div id="app-bottomnav"></div>
<div id="app-whatsapp"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/animations.js"></script>
<script>
locationGate(); mountChrome('cat');

let activeCat = qParam('cat') || 'all';
let activeFood = get(LS.foodFilter,'all') || 'all';
let searchQ = (qParam('q')||'').toLowerCase();

// chips
document.getElementById('catChips').innerHTML = SRI.categories.map(c=>`<button class="chip catChip ml-2" data-cat="${c.id}">${c.emoji} ${c.name}</button>`).join('');
document.getElementById('sideCats').innerHTML = `<button class="block text-sm py-1 sideCat font-semibold" data-cat="all">All products</button>`+SRI.categories.map(c=>`<button class="block text-sm py-1 sideCat" data-cat="${c.id}">${c.emoji} ${c.name}</button>`).join('');

function setCat(cat){ activeCat=cat; document.querySelectorAll('.catChip').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat)); document.querySelectorAll('.sideCat').forEach(b=>b.classList.toggle('text-[var(--green-700)]',b.dataset.cat===cat)); document.querySelectorAll('.sideCat').forEach(b=>b.classList.toggle('font-extrabold',b.dataset.cat===cat)); const c=SRI.categories.find(x=>x.id===cat); document.getElementById('catTitle').textContent = c?c.name:(searchQ?`Results for “${searchQ}”`:'All Products'); render(); }
document.addEventListener('click',e=>{ const b=e.target.closest('.catChip,.sideCat'); if(b){ setCat(b.dataset.cat);} });
document.querySelectorAll('.foodChip').forEach(b=>b.addEventListener('click',()=>{ activeFood=b.dataset.f; set(LS.foodFilter,activeFood); document.querySelectorAll('.foodChip').forEach(x=>x.classList.toggle('active',x===b)); render(); }));
document.querySelector(`.foodChip[data-f="${activeFood}"]`)?.classList.add('active');
document.querySelectorAll('.foodChip').forEach(x=>{ if(x.dataset.f!==activeFood)x.classList.remove('active'); });

function currentList(){
  let list = SRI.products.slice();
  if(activeCat!=='all') list = list.filter(p=>p.catId===activeCat);
  if(activeFood!=='all') list = list.filter(p=>p.foodType===activeFood);
  if(searchQ) list = list.filter(p=>p.name.toLowerCase().includes(searchQ));
  const maxP = +(document.getElementById('priceRange').value||500);
  list = list.filter(p=>p.price<=maxP);
  if(document.getElementById('inStock').checked) list = list.filter(p=>p.inStock);
  const s=document.getElementById('sort').value;
  if(s==='lh')list.sort((a,b)=>a.price-b.price);
  else if(s==='hl')list.sort((a,b)=>b.price-a.price);
  else if(s==='rt')list.sort((a,b)=>b.rating-a.rating);
  else list.sort((a,b)=>(b.orderedTimes)-(a.orderedTimes));
  return list;
}
function render(){
  const list=currentList(), grid=document.getElementById('grid'), empty=document.getElementById('empty');
  grid.innerHTML = skeletonCards(8);
  setTimeout(()=>{
    if(!list.length){ grid.innerHTML=''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');
    grid.innerHTML = list.map(p=>productCard(p)).join('');
    lucide.createIcons();
  },250);
}
function openFilter(){ document.getElementById('filterSheet').classList.remove('hidden'); }
function closeFilter(){ document.getElementById('filterSheet').classList.add('hidden'); }
function applyMobileFilter(){ document.getElementById('priceRange').value=document.getElementById('priceRangeM').value; document.getElementById('priceVal').textContent='₹'+document.getElementById('priceRangeM').value; document.getElementById('inStock').checked=document.getElementById('inStockM').checked; closeFilter(); render(); }
function resetFilters(){ activeFood='all'; document.querySelectorAll('.foodChip').forEach(x=>x.classList.toggle('active',x.dataset.f==='all')); document.getElementById('priceRange').value=500; document.getElementById('priceVal').textContent='₹500'; document.getElementById('inStock').checked=false; searchQ=''; render(); }

const csearch=document.getElementById('catSearch');
csearch && csearch.addEventListener('input',e=>{ searchQ=e.target.value.toLowerCase(); render(); });

setCat(activeCat);
lucide.createIcons();
</script>
</body>
</html>
