<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Your Cart — SRI AADHYA FROZENS</title>
<link rel="icon" type="image/png" href="assets/images/logo.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.png"/>
<link rel="shortcut icon" type="image/x-icon" href="assets/images/logo.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{screens:{xs:'420px'}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css"/>
<script src="https://unpkg.com/lucide@latest"></script>
<script>if(!JSON.parse(localStorage.getItem('dittomart_location')||'null')?.latitude)location.replace('login.html');</script>
</head>
<body>
<div id="app-header"></div>

<main class="pt-16 pb-28 lg:pb-10">
  <div class="max-w-7xl mx-auto px-4 lg:px-8 mt-4">
    <h1 class="display text-2xl font-extrabold mb-4 flex items-center gap-2"><i data-lucide="shopping-cart" class="w-6 h-6 text-[var(--green-700)]"></i> Your Cart</h1>

    <div id="emptyCart" class="hidden text-center py-16">
      <div class="text-6xl mb-3">🛒</div>
      <p class="font-bold text-lg">Your cart is empty</p>
      <p class="text-sm text-[var(--ink-soft)] mt-1">Add some fresh essentials to get started</p>
      <a href="home.html" class="btn btn-primary mt-4 px-6 py-3 inline-flex">Start shopping</a>
    </div>

    <div id="cartWrap" class="flex flex-col lg:flex-row gap-6">
      <!-- items -->
      <div class="lg:w-2/3">
        <div class="card p-3 mb-3 flex items-center gap-2 text-sm bg-[var(--leaf-100)] border-[var(--green-500)]/30">
          <i data-lucide="zap" class="w-4 h-4 text-[var(--green-700)]"></i> <b>Delivery in 30 min</b> <span class="text-[var(--ink-soft)]">to <span id="cartArea"></span></span>
        </div>
        <div id="items" class="space-y-3"></div>

        <!-- FBT -->
        <h3 class="display text-lg font-extrabold mt-7 mb-3 flex items-center gap-2"><i data-lucide="plus-circle" class="w-5 h-5 text-[var(--green-700)]"></i> You might also like</h3>
        <div id="fbt" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
      </div>

      <!-- summary -->
      <div class="lg:w-1/3">
        <div class="card p-5 lg:sticky lg:top-20">
          <h3 class="font-extrabold mb-3">Bill details</h3>

          <!-- coupon -->
          <div id="couponBox" class="mb-4">
            <div class="flex gap-2">
              <input id="coupon" placeholder="Coupon code" class="field uppercase"/>
              <button onclick="applyCoupon()" class="btn btn-dark px-4">Apply</button>
            </div>
            <div class="flex gap-1.5 mt-2 flex-wrap">
              <button onclick="document.getElementById('coupon').value='SAVE50';applyCoupon()" class="chip text-[11px]">SAVE50</button>
              <button onclick="document.getElementById('coupon').value='FRESH10';applyCoupon()" class="chip text-[11px]">FRESH10</button>
              <button onclick="document.getElementById('coupon').value='BLOSSOM';applyCoupon()" class="chip text-[11px]">BLOSSOM</button>
            </div>
            <a href="coupon.html" class="text-xs font-bold text-[var(--green-700)] mt-2 inline-block">View all offers →</a>
            <div id="couponMsg" class="text-xs mt-2"></div>
          </div>

          <div class="space-y-2 text-sm border-t border-[var(--line)] pt-3">
            <div class="flex justify-between"><span class="text-[var(--ink-soft)]">Item total</span><span id="sumItems"></span></div>
            <div class="flex justify-between" id="discRow" style="display:none"><span class="text-[var(--green-700)]">Coupon discount</span><span id="sumDisc" class="text-[var(--green-700)]"></span></div>
            <div class="flex justify-between"><span class="text-[var(--ink-soft)]">Delivery charge <span class="text-[10px]">(per km)</span></span><span id="sumDel"></span></div>
            <div class="flex justify-between"><span class="text-[var(--ink-soft)]">Taxes & charges</span><span id="sumTax"></span></div>
            <div class="flex justify-between font-extrabold text-lg border-t border-[var(--line)] pt-2 mt-1"><span>To Pay</span><span id="sumTotal" class="text-[var(--green-800)]"></span></div>
            <div id="savings" class="text-xs text-[var(--green-700)] font-bold"></div>
          </div>

          <button onclick="proceed()" class="btn btn-primary w-full mt-4 py-3.5 text-base">Proceed to Checkout <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
          <div class="flex items-center justify-center gap-3 mt-3 text-[11px] text-[var(--ink-soft)]">
            <span class="flex items-center gap-1"><i data-lucide="lock" class="w-3 h-3"></i> Secure</span>
            <span class="flex items-center gap-1"><i data-lucide="users" class="w-3 h-3"></i> 1,240+ happy customers</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- mobile sticky checkout -->
<div id="mobileCheckout" class="action-bar glass border-t border-[var(--line)] px-4 py-3 lg:hidden flex items-center gap-3">
  <div><div class="text-[11px] text-[var(--ink-soft)]">To Pay</div><div id="barTotal" class="font-extrabold text-lg"></div></div>
  <button onclick="proceed()" class="btn btn-primary flex-1 py-3">Checkout <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
</div>

<div id="app-footer"></div>
<div id="app-bottomnav"></div>
<div id="app-whatsapp"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/animations.js"></script>
<script>
locationGate(); mountChrome('cart');
document.getElementById('cartArea').textContent = deliveringArea();

let appliedCoupon = null;

function calc(){
  const sub = cartSubtotal();
  let disc = 0;
  if(appliedCoupon){
    const c = SRI.coupons[appliedCoupon];
    if(sub >= c.min){ disc = c.type==='flat'?c.value:Math.min(c.max||1e9, Math.round(sub*c.value/100)); }
    else { appliedCoupon=null; }
  }
  const del = cartCount()? deliveryCharge():0;
  const tax = Math.round((sub-disc)*0.05);
  const total = Math.max(0, sub-disc)+del+tax;
  return {sub,disc,del,tax,total};
}

function render(){
  const cart = getCart();
  if(!cart.length){ document.getElementById('emptyCart').classList.remove('hidden'); document.getElementById('cartWrap').classList.add('hidden'); document.getElementById('mobileCheckout').style.display='none'; return; }
  document.getElementById('items').innerHTML = cart.map(it=>`
    <div class="card p-3 flex gap-3 items-center">
      <img src="${it.img}" class="w-16 h-16 rounded-xl object-cover flex-none"/>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5">${foodMark(it.foodType)}<span class="font-bold text-sm truncate">${it.name}</span></div>
        <div class="text-[12px] text-[var(--ink-soft)]">${it.unit} • ${rupee(it.price)}</div>
        <button onclick="removeFromCart('${it.key}');render()" class="text-[11px] text-[var(--coral)] font-bold mt-1 flex items-center gap-1"><i data-lucide="trash-2" class="w-3 h-3"></i>Remove</button>
      </div>
      <div class="text-right">
        <div class="stepper mb-1"><button onclick="setQty('${it.key}',${it.qty-1});render()">−</button><span>${it.qty}</span><button onclick="setQty('${it.key}',${it.qty+1});render()">+</button></div>
        <div class="font-extrabold text-sm">${rupee(it.price*it.qty)}</div>
      </div>
    </div>`).join('');

  const c = calc();
  document.getElementById('sumItems').textContent = rupee(c.sub);
  document.getElementById('sumDel').textContent = rupee(c.del);
  document.getElementById('sumTax').textContent = rupee(c.tax);
  document.getElementById('sumTotal').textContent = rupee(c.total);
  document.getElementById('barTotal').textContent = rupee(c.total);
  const dr=document.getElementById('discRow');
  if(c.disc>0){ dr.style.display='flex'; document.getElementById('sumDisc').textContent='− '+rupee(c.disc); document.getElementById('savings').textContent=`🎉 You saved ${rupee(c.disc)} on this order`; }
  else { dr.style.display='none'; document.getElementById('savings').textContent=''; }
  lucide.createIcons();
}

function applyCoupon(){
  const code = document.getElementById('coupon').value.trim().toUpperCase();
  const msg = document.getElementById('couponMsg');
  const c = SRI.coupons[code];
  if(!c){ msg.innerHTML='<span class="text-[var(--coral)] flex items-center gap-1"><i data-lucide="x-circle" class="w-3.5 h-3.5"></i>Invalid coupon code</span>'; lucide.createIcons(); return; }
  if(cartSubtotal() < c.min){ msg.innerHTML=`<span class="text-[var(--coral)]">Add items worth ${rupee(c.min)} to use this</span>`; return; }
  appliedCoupon=code; msg.innerHTML=`<span class="text-[var(--green-700)] flex items-center gap-1"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>${c.label} applied!</span>`; lucide.createIcons(); render(); toast('Coupon applied 🎉','ok','ticket');
}

function proceed(){
  if(!getCart().length){ toast('Cart is empty','err','x'); return; }
  if(!isServiceable()){
    toast(`Your location is outside our ${SRI.BRAND.radiusKm} km delivery zone`,'err','map-pin');
    setTimeout(()=>location.href='not-serviceable.html',900);
    return;
  }
  set('dittomart_checkout', calc());
  if(isLoggedIn()) location.href='address.html';
  else location.href='login.html?next=address.html';
}

// FBT
const inCart = new Set(getCart().map(i=>i.id));
const fbt = SRI.products.filter(p=>!inCart.has(p.id) && (p.bestseller||p.trending)).slice(0,4);
document.getElementById('fbt').innerHTML = fbt.map(p=>productCard(p)).join('');

// auto-apply coupon selected from offers page
const pend = localStorage.getItem('dittomart_pending_coupon');
if(pend){ localStorage.removeItem('dittomart_pending_coupon'); document.getElementById('coupon').value=pend; }

render();
if(pend) applyCoupon();
lucide.createIcons();
</script>
</body>
</html>
