<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Product — SRI AADHYA FROZENS</title>
<link rel="icon" type="image/png" href="assets/images/logo.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.png"/>
<link rel="shortcut icon" type="image/x-icon" href="assets/images/logo.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{screens:{xs:'420px'}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css"/>
<script src="https://unpkg.com/lucide@latest"></script>
<script>if(!JSON.parse(localStorage.getItem('dittomart_location')||'null')?.latitude)location.replace('login.html');</script>
</head>
<body>
<div id="app-header"></div>

<main class="pt-16 pb-28 lg:pb-10">
  <div class="max-w-7xl mx-auto px-4 lg:px-8 mt-3">
    <!-- breadcrumb -->
    <div class="text-xs text-[var(--ink-soft)] flex items-center gap-1 mb-3">
      <a href="home.html" class="hover:text-[var(--green-700)]">Home</a><i data-lucide="chevron-right" class="w-3 h-3"></i>
      <a id="bcCat" href="category.html" class="hover:text-[var(--green-700)]">Category</a><i data-lucide="chevron-right" class="w-3 h-3"></i>
      <span id="bcName" class="text-[var(--ink)] font-semibold"></span>
    </div>

    <div id="detail" class="flex flex-col lg:flex-row gap-6 lg:gap-10"></div>

    <!-- frequently bought together -->
    <section class="mt-10">
      <h2 class="display text-xl font-extrabold mb-3 flex items-center gap-2"><i data-lucide="layers" class="w-5 h-5 text-[var(--green-700)]"></i> Frequently bought together</h2>
      <div id="fbt" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
    </section>
  </div>
</main>

<!-- mobile sticky add bar -->
<div id="stickyBar" class="action-bar glass border-t border-[var(--line)] px-4 py-3 lg:hidden flex items-center gap-3">
  <div><div class="text-[11px] text-[var(--ink-soft)]">Total</div><div id="barPrice" class="font-extrabold text-lg"></div></div>
  <button onclick="addCurrent(false)" class="btn btn-ghost flex-1 py-3">Add to Cart</button>
  <button onclick="addCurrent(true)" class="btn btn-primary flex-1 py-3">Buy Now</button>
</div>

<div id="app-footer"></div>
<div id="app-bottomnav"></div>
<div id="app-whatsapp"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/animations.js"></script>
<script>
locationGate(); mountChrome('');

const id = qParam('id');
const p = SRI.products.find(x=>x.id===id) || SRI.products[0];
const cat = SRI.categories.find(c=>c.id===p.catId);
let qty=1, variant = p.variants ? p.variants[0].label : null;
let unitPrice = p.variants ? p.variants[0].price : p.price;

document.getElementById('bcCat').textContent = cat?cat.name:'Category';
document.getElementById('bcCat').href = 'category.html?cat='+p.catId;
document.getElementById('bcName').textContent = p.name;

const gallery = [p.img, cat?cat.img:p.img, p.img.replace('w=500&h=500','w=520&h=520')];

function priceNow(){ return unitPrice*qty; }
function syncBar(){ document.getElementById('barPrice').textContent = rupee(priceNow()); }

function renderDetail(){
  const off = discountPct(unitPrice, p.mrp);
  document.getElementById('detail').innerHTML = `
  <!-- gallery -->
  <div class="lg:w-1/2">
    <div class="card overflow-hidden aspect-square relative">
      <span class="absolute top-3 left-3 z-10">${foodMark(p.foodType,'')}</span>
      ${p.bestseller?`<span class="absolute top-3 right-3 z-10 bg-[var(--green-700)] text-white text-[11px] font-bold px-2 py-1 rounded-full flex items-center gap-1"><i data-lucide="flame" class="w-3 h-3"></i>Bestseller</span>`:''}
      <img id="mainImg" src="${gallery[0]}" class="w-full h-full object-cover"/>
    </div>
    <div class="flex gap-2 mt-3">
      ${gallery.map((g,i)=>`<button onclick="document.getElementById('mainImg').src='${g}';document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('ring-2'));this.classList.add('ring-2')" class="thumb ${i===0?'ring-2':''} ring-[var(--green-600)] w-16 h-16 rounded-xl overflow-hidden card"><img src="${g}" class="w-full h-full object-cover"/></button>`).join('')}
    </div>
  </div>

  <!-- info -->
  <div class="lg:w-1/2">
    ${p.orderedTimes>100?`<div class="inline-flex items-center gap-1 text-[12px] font-bold text-[var(--green-700)] bg-[var(--leaf-100)] px-2.5 py-1 rounded-full mb-2"><i data-lucide="flame" class="w-3.5 h-3.5"></i>Ordered ${p.orderedTimes}× this week</div>`:''}
    <h1 class="display text-2xl lg:text-3xl font-extrabold leading-tight flex items-start gap-2">${foodMark(p.foodType)} <span>${p.name}</span></h1>
    <div class="flex items-center gap-2 mt-2">
      <div class="flex gap-.5">${star(p.rating)}</div>
      <span class="text-sm font-bold">${p.rating.toFixed(1)}</span>
      <span class="text-sm text-[var(--ink-soft)]">• ${p.reviews} ratings</span>
      ${p.trending?`<span class="text-[11px] font-bold text-[var(--mustard)] flex items-center gap-1"><i data-lucide="trending-up" class="w-3.5 h-3.5"></i>Trending</span>`:''}
    </div>

    <div class="flex items-end gap-3 mt-4">
      <span id="bigPrice" class="display text-3xl font-extrabold">${rupee(unitPrice)}</span>
      ${p.mrp>unitPrice?`<span class="text-[var(--ink-soft)] line-through">${rupee(p.mrp)}</span><span class="bg-[var(--coral)] text-white text-xs font-extrabold px-2 py-1 rounded-md">${off}% OFF</span>`:''}
    </div>
    <p class="text-xs text-[var(--ink-soft)] mt-1">Inclusive of all taxes • per ${variant||p.unit}</p>

    ${p.variants?`<div class="mt-5"><div class="text-sm font-bold mb-2">Pack size</div><div class="flex gap-2" id="variants">
      ${p.variants.map((v,i)=>`<button onclick="pickVariant(${i})" class="varBtn chip ${i===0?'active':''}" data-i="${i}">${v.label} • ${rupee(v.price)}</button>`).join('')}
    </div></div>`:''}

    <div class="flex items-center gap-4 mt-6">
      <div class="text-sm font-bold">Quantity</div>
      <div class="stepper">
        <button onclick="chQty(-1)">−</button><span id="qtyVal">1</span><button onclick="chQty(1)">+</button>
      </div>
      <div class="ml-auto text-right"><div class="text-[11px] text-[var(--ink-soft)]">Subtotal</div><div id="subT" class="font-extrabold">${rupee(unitPrice)}</div></div>
    </div>

    <div class="hidden lg:flex gap-3 mt-6">
      <button onclick="addCurrent(false)" class="btn btn-ghost flex-1 py-3.5 text-base">Add to Cart</button>
      <button onclick="addCurrent(true)" class="btn btn-primary flex-1 py-3.5 text-base">Buy Now <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
    </div>

    <!-- delivery -->
    <div class="card p-4 mt-6 flex items-center gap-3">
      <i data-lucide="truck" class="w-6 h-6 text-[var(--green-700)]"></i>
      <div class="text-sm"><b>Delivery in 30 minutes</b><div class="text-[var(--ink-soft)] text-[12px]">to ${deliveringArea()} • delivery charge as per km</div></div>
    </div>

    <!-- trust icons -->
    <div class="grid grid-cols-3 gap-2 mt-3 text-center">
      <div class="card p-3"><i data-lucide="leaf" class="w-5 h-5 text-[var(--green-700)] mx-auto"></i><div class="text-[11px] font-bold mt-1">Quality assured</div></div>
      <div class="card p-3"><i data-lucide="snowflake" class="w-5 h-5 text-[var(--green-700)] mx-auto"></i><div class="text-[11px] font-bold mt-1">Cold-chain</div></div>
      <div class="card p-3"><i data-lucide="badge-check" class="w-5 h-5 text-[var(--green-700)] mx-auto"></i><div class="text-[11px] font-bold mt-1">Hygienic pack</div></div>
    </div>

    <div class="mt-6">
      <h3 class="font-extrabold mb-1">About this product</h3>
      <p class="text-sm text-[var(--ink-soft)] leading-relaxed">${p.desc}</p>
    </div>
  </div>`;
  lucide.createIcons();
  syncBar();
}

function pickVariant(i){ variant=p.variants[i].label; unitPrice=p.variants[i].price; document.querySelectorAll('.varBtn').forEach(b=>b.classList.toggle('active',+b.dataset.i===i)); document.getElementById('bigPrice').textContent=rupee(unitPrice); updateSub(); }
function chQty(d){ qty=Math.max(1,qty+d); document.getElementById('qtyVal').textContent=qty; updateSub(); }
function updateSub(){ document.getElementById('subT').textContent=rupee(priceNow()); syncBar(); }
function addCurrent(buyNow){ addToCart(p.id, qty, {variant: p.variants?variant:null, price:unitPrice}); if(buyNow) setTimeout(()=>location.href='cart.html',400); }

renderDetail();

// FBT — other items from same or related category
const fbt = SRI.products.filter(x=>x.id!==p.id && (x.catId===p.catId || x.bestseller)).slice(0,5);
document.getElementById('fbt').innerHTML = fbt.map(x=>productCard(x)).join('');
lucide.createIcons();
</script>
</body>
</html>
