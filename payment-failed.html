<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Payment Failed — SRI AADHYA FROZENS</title>
<link rel="icon" type="image/png" href="assets/images/logo.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{screens:{xs:'420px'}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css"/>
<script src="https://unpkg.com/lucide@latest"></script>
<script>if(!JSON.parse(localStorage.getItem('dittomart_location')||'null')?.latitude)location.replace('login.html');</script>
</head>
<body class="min-h-screen flex items-center justify-center px-6 bg-[var(--cream)]">
  <div class="max-w-md w-full text-center" style="animation:fadeUp .5s ease">
    <div id="icon" class="w-24 h-24 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-5">
      <i data-lucide="x-circle" class="w-12 h-12 text-[var(--coral)]"></i>
    </div>
    <h1 id="title" class="display text-2xl font-extrabold">Payment Failed</h1>
    <p id="msg" class="text-[var(--ink-soft)] text-sm mt-2">Your payment could not be completed. Don't worry — no money was deducted. Please try again.</p>

    <div class="flex flex-col gap-3 mt-6">
      <button onclick="location.href='payment.html'" class="btn btn-primary w-full py-3.5"><i data-lucide="refresh-cw" class="w-4 h-4"></i> Retry Payment</button>
      <button id="altBtn" onclick="location.href='cart.html'" class="btn btn-ghost w-full py-3">Back to Cart</button>
      <button id="hoursBtn" onclick="openStoreHours()" class="btn btn-ghost w-full py-3 hidden">View Store Hours</button>
    </div>
  </div>
<div id="app-whatsapp"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
mountChrome('');
lucide.createIcons();
if(qParam('reason')==='store'){
  document.getElementById('icon').innerHTML='<i data-lucide="store" class="w-12 h-12 text-[var(--mustard)]"></i>';
  document.getElementById('icon').className='w-24 h-24 rounded-full bg-yellow-50 flex items-center justify-center mx-auto mb-5';
  document.getElementById('title').textContent='Store Currently Unavailable';
  document.getElementById('msg').textContent='Our store is not accepting orders at this moment. Please try again later.';
  document.getElementById('hoursBtn').classList.remove('hidden');
}
lucide.createIcons();
</script>
</body>
</html>
