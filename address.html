<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Delivery Address — SRI AADHYA FROZENS</title>
<link rel="icon" type="image/png" href="assets/images/logo.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.png"/>
<link rel="shortcut icon" type="image/x-icon" href="assets/images/logo.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{screens:{xs:'420px'}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css"/>
<script src="https://unpkg.com/lucide@latest"></script>
<script>if(!JSON.parse(localStorage.getItem('dittomart_location')||'null')?.latitude)location.replace('login.html');</script>
</head>
<body>
<div id="app-header"></div>
<main class="pt-16 pb-28 lg:pb-10">
  <div class="max-w-3xl mx-auto px-4 lg:px-8 mt-4">
    <a href="cart.html" class="text-sm font-bold text-[var(--green-700)] flex items-center gap-1 mb-3"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back to cart</a>
    <h1 class="display text-2xl font-extrabold mb-4 flex items-center gap-2"><i data-lucide="map-pin" class="w-6 h-6 text-[var(--green-700)]"></i> Delivery Address</h1>

    <!-- saved list -->
    <div id="savedList" class="space-y-3 mb-5"></div>

    <button onclick="toggleForm(true)" id="addBtn" class="btn btn-ghost w-full py-3.5 border-2 border-dashed border-[var(--green-500)]/40"><i data-lucide="plus" class="w-5 h-5"></i> Add New Address</button>

    <!-- form -->
    <div id="addrForm" class="card p-5 mt-5 hidden">
      <h3 class="font-extrabold mb-3">New Address</h3>

      <!-- methods -->
      <div class="grid grid-cols-1 gap-2 mb-4">
        <button onclick="detectGPS()" id="gpsBtn" class="btn btn-primary py-3"><i data-lucide="navigation" class="w-5 h-5"></i> <span id="gpsLabel">Use Current Location</span></button>
        <div class="relative">
          <div class="flex items-center bg-[var(--cream)] border border-[var(--line)] rounded-xl px-3 h-12">
            <i data-lucide="search" class="w-5 h-5 text-[var(--ink-soft)]"></i>
            <input id="areaSearch" autocomplete="off" placeholder="Or search your area…" class="flex-1 bg-transparent outline-none px-2 text-sm"/>
          </div>
          <div id="sg" class="absolute left-0 right-0 mt-1 bg-white border border-[var(--line)] rounded-xl shadow-lg z-10 overflow-hidden hidden"></div>
        </div>
      </div>

      <!-- coordinate status -->
      <div id="coordBox" class="hidden mb-4 p-3 rounded-xl text-sm"></div>

      <div class="grid grid-cols-2 gap-3">
        <div class="col-span-2">
          <label class="text-xs font-bold">Address label</label>
          <div class="flex gap-2 mt-1">
            <button type="button" data-label="Home" class="lblBtn chip active"><i data-lucide="home" class="w-3.5 h-3.5"></i> Home</button>
            <button type="button" data-label="Work" class="lblBtn chip"><i data-lucide="briefcase" class="w-3.5 h-3.5"></i> Work</button>
            <button type="button" data-label="Other" class="lblBtn chip"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i> Other</button>
          </div>
        </div>
        <div><label class="text-xs font-bold">Receiver name*</label><input id="rname" class="field mt-1"/></div>
        <div><label class="text-xs font-bold">Phone (10-digit)*</label><input id="rphone" maxlength="10" inputmode="numeric" class="field mt-1"/></div>
        <div><label class="text-xs font-bold">House / Flat No.*</label><input id="house" class="field mt-1"/></div>
        <div><label class="text-xs font-bold">Building / Apt</label><input id="building" class="field mt-1"/></div>
        <div class="col-span-2"><label class="text-xs font-bold">Street / Area*</label><input id="street" class="field mt-1"/></div>
        <div class="col-span-2"><label class="text-xs font-bold">Landmark (optional)</label><input id="landmark" class="field mt-1"/></div>
        <div><label class="text-xs font-bold">City*</label><input id="city" class="field mt-1" value="Tirupur"/></div>
        <div><label class="text-xs font-bold">Pincode (6-digit)*</label><input id="pincode" maxlength="6" inputmode="numeric" class="field mt-1"/></div>
        <div><label class="text-xs font-bold">Latitude</label><input id="lat" class="field mt-1 bg-[var(--cream)]" readonly placeholder="auto"/></div>
        <div><label class="text-xs font-bold">Longitude</label><input id="lng" class="field mt-1 bg-[var(--cream)]" readonly placeholder="auto"/></div>
      </div>

      <!-- map preview thumbnail -->
      <div id="mapPrev" class="hidden mt-3 rounded-xl overflow-hidden border border-[var(--line)] relative h-28 bg-[var(--cream-2)]">
        <div class="absolute inset-0 flex items-center justify-center"><i data-lucide="map-pin" class="w-8 h-8 text-[var(--green-700)] pulse-ring"></i></div>
        <div class="absolute bottom-1 left-2 text-[10px] font-mono bg-white/80 px-1.5 rounded" id="mapCoord"></div>
      </div>

      <div id="formErr" class="text-xs text-[var(--coral)] mt-3"></div>
      <div class="flex gap-2 mt-4">
        <button onclick="toggleForm(false)" class="btn btn-ghost flex-1 py-3">Cancel</button>
        <button id="saveBtn" onclick="saveAddr()" class="btn btn-primary flex-1 py-3 opacity-50" disabled>Save Address</button>
      </div>
      <p class="text-[11px] text-[var(--ink-soft)] mt-2 flex items-center gap-1"><i data-lucide="info" class="w-3 h-3"></i> GPS coordinates are required for delivery routing.</p>
    </div>

    <button id="continueBtn" onclick="continueCheckout()" class="btn btn-primary w-full mt-6 py-3.5 text-base hidden">Deliver here & Continue <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
  </div>
</main>
<div id="app-bottomnav"></div>
<div id="app-whatsapp"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
serviceableGate(); mountChrome('');

const STORE={lat:SRI.BRAND.storeLat,lng:SRI.BRAND.storeLng};
const AREAS=[
  {area:"Avinashi",pincode:"641654",lat:11.1925,lng:77.2680},
  {area:"Avinashi Road, Tirupur",pincode:"641603",lat:11.1389,lng:77.3210},
  {area:"Mangalam, Tirupur",pincode:"641663",lat:11.1602,lng:77.2475},
  {area:"Tirupur Central",pincode:"641601",lat:11.1085,lng:77.3411},
  {area:"Palladam",pincode:"641664",lat:10.9920,lng:77.2870},
];
let captured=null, selectedLabel="Home";

function renderSaved(){
  const list=get(LS.addr,[]);
  const wrap=document.getElementById('savedList');
  if(!list.length){ wrap.innerHTML=`<div class="card p-4 text-sm text-[var(--ink-soft)] text-center">No saved addresses yet. Add one to continue.</div>`; document.getElementById('continueBtn').classList.add('hidden'); return; }
  const active=get(LS.activeAddr);
  wrap.innerHTML=list.map(a=>`
    <div class="card p-4 flex gap-3 ${a.id===active?'ring-2 ring-[var(--green-600)]':''}" onclick="selectAddr('${a.id}')" role="button">
      <input type="radio" name="addr" class="accent-[var(--green-700)] mt-1" ${a.id===active?'checked':''}/>
      <div class="flex-1">
        <div class="flex items-center gap-2"><span class="text-[11px] font-extrabold uppercase bg-[var(--leaf-100)] text-[var(--green-800)] px-2 py-.5 rounded">${a.label}</span><span class="font-bold text-sm">${a.receiver_name}</span><span class="text-[11px] text-[var(--ink-soft)]">${a.distance_km} km</span></div>
        <div class="text-sm text-[var(--ink-soft)] mt-1">${a.house_no}, ${a.building?a.building+', ':''}${a.street}, ${a.city} - ${a.pincode}</div>
        <div class="text-[11px] text-[var(--ink-soft)] font-mono mt-.5">📍 ${a.latitude}, ${a.longitude}</div>
        <div class="flex gap-3 mt-2"><button onclick="event.stopPropagation();delAddr('${a.id}')" class="text-[11px] text-[var(--coral)] font-bold flex items-center gap-1"><i data-lucide="trash-2" class="w-3 h-3"></i>Delete</button></div>
      </div>
    </div>`).join('');
  document.getElementById('continueBtn').classList.remove('hidden');
  lucide.createIcons();
}
function selectAddr(id){ set(LS.activeAddr,id); renderSaved(); }
function delAddr(id){ set(LS.addr,get(LS.addr,[]).filter(a=>a.id!==id)); if(get(LS.activeAddr)===id) localStorage.removeItem(LS.activeAddr); renderSaved(); toast('Address removed','','trash-2'); }

function toggleForm(show){ document.getElementById('addrForm').classList.toggle('hidden',!show); document.getElementById('addBtn').classList.toggle('hidden',show); if(show)document.getElementById('addrForm').scrollIntoView({behavior:'smooth'}); }

document.querySelectorAll('.lblBtn').forEach(b=>b.addEventListener('click',()=>{ selectedLabel=b.dataset.label; document.querySelectorAll('.lblBtn').forEach(x=>x.classList.toggle('active',x===b)); }));

// search
const sg=document.getElementById('sg');
document.getElementById('areaSearch').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q){sg.classList.add('hidden');return;}
  const m=AREAS.filter(a=>a.area.toLowerCase().includes(q));
  if(!m.length){ sg.innerHTML=`<div class="p-3 text-sm text-[var(--ink-soft)]">Address not found. Please use Detect Location instead.</div>`; sg.classList.remove('hidden'); return; }
  sg.innerHTML=m.map(a=>`<button onclick='pick(${JSON.stringify(a)})' class="w-full text-left px-3 py-2.5 hover:bg-[var(--cream)] border-b border-[var(--line)] last:border-0 text-sm"><b>${a.area}</b> <span class="text-[11px] text-[var(--ink-soft)]">${a.pincode}</span></button>`).join('');
  sg.classList.remove('hidden');
});
function pick(a){ sg.classList.add('hidden'); document.getElementById('areaSearch').value=a.area; fill(a.lat,a.lng,a.area,a.pincode); }

function detectGPS(){
  const b=document.getElementById('gpsBtn'),l=document.getElementById('gpsLabel');
  l.textContent='Detecting…'; b.disabled=true; b.querySelector('i').classList.add('animate-spin');
  const done=(lat,lng,name,pin)=>{ b.querySelector('i').classList.remove('animate-spin'); b.disabled=false; l.textContent='Use Current Location'; fill(lat,lng,name,pin); };
  if(!navigator.geolocation){ setTimeout(()=>done(STORE.lat+0.01,STORE.lng+0.008,'Avinashi','641654'),800); return; }
  navigator.geolocation.getCurrentPosition(
    p=>done(p.coords.latitude,p.coords.longitude,'',''),
    ()=>{ toast('GPS denied — search your area','err','x'); done(STORE.lat+0.011,STORE.lng+0.007,'Near Avinashi','641654'); },{timeout:8000});
}

function fill(lat,lng,name,pin){
  const dist=distanceKm(STORE.lat,STORE.lng,lat,lng);
  const serviceable=dist<=SRI.BRAND.radiusKm;
  captured={lat:+lat.toFixed(5),lng:+lng.toFixed(5),dist:+dist.toFixed(1),serviceable};
  document.getElementById('lat').value=captured.lat;
  document.getElementById('lng').value=captured.lng;
  if(name)document.getElementById('street').value=document.getElementById('street').value||name;
  if(pin)document.getElementById('pincode').value=document.getElementById('pincode').value||pin;
  const cb=document.getElementById('coordBox'); cb.classList.remove('hidden');
  document.getElementById('mapPrev').classList.remove('hidden');
  document.getElementById('mapCoord').textContent=`${captured.lat}, ${captured.lng}`;
  if(serviceable){ cb.className='mb-4 p-3 rounded-xl text-sm bg-[var(--leaf-100)] text-[var(--green-800)]'; cb.innerHTML=`<b>📍 Location captured</b> • ${dist.toFixed(1)} km from store — we deliver here ✅`; toast('📍 Location captured','ok','map-pin'); }
  else{ cb.className='mb-4 p-3 rounded-xl text-sm bg-red-50 text-[var(--coral)]'; cb.innerHTML=`This address is ${dist.toFixed(1)} km away — outside our 10 km delivery area. Please choose a different one.`; }
  validate(); lucide.createIcons();
}

['rname','rphone','house','street','pincode'].forEach(id=>document.getElementById(id).addEventListener('input',validate));
function validate(){
  const ok = captured && captured.serviceable
    && document.getElementById('rname').value.trim()
    && /^\d{10}$/.test(document.getElementById('rphone').value.trim())
    && document.getElementById('house').value.trim()
    && document.getElementById('street').value.trim()
    && /^\d{6}$/.test(document.getElementById('pincode').value.trim());
  const btn=document.getElementById('saveBtn');
  btn.disabled=!ok; btn.classList.toggle('opacity-50',!ok);
  return ok;
}

function saveAddr(){
  const err=document.getElementById('formErr'); err.textContent='';
  if(!captured){ err.textContent='Please capture GPS coordinates (Detect Location or Search).'; return; }
  if(!captured.serviceable){ err.textContent='This address is outside our delivery area.'; return; }
  if(!validate()){ err.textContent='Please fill all required fields correctly (10-digit phone, 6-digit pincode).'; return; }
  const list=get(LS.addr,[]);
  const a={ id:'addr_'+(list.length+1).toString().padStart(3,'0')+'_'+Math.floor(performance.now()),
    label:selectedLabel, receiver_name:document.getElementById('rname').value.trim(),
    phone:document.getElementById('rphone').value.trim(), house_no:document.getElementById('house').value.trim(),
    building:document.getElementById('building').value.trim(), street:document.getElementById('street').value.trim(),
    landmark:document.getElementById('landmark').value.trim(), city:document.getElementById('city').value.trim()||'Tirupur',
    pincode:document.getElementById('pincode').value.trim(), latitude:captured.lat, longitude:captured.lng,
    distance_km:captured.dist, is_serviceable:true, created_at:new Date().toISOString() };
  list.push(a); set(LS.addr,list); set(LS.activeAddr,a.id);
  toggleForm(false); captured=null; renderSaved(); toast('Address saved 🌱','ok','check');
  ['rname','rphone','house','building','street','landmark','pincode','lat','lng'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('coordBox').classList.add('hidden'); document.getElementById('mapPrev').classList.add('hidden');
}

function continueCheckout(){
  if(!get(LS.activeAddr)){ toast('Select a delivery address','err','x'); return; }
  location.href='payment.html';
}

renderSaved();
lucide.createIcons();
</script>
</body>
</html>
